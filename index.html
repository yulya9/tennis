<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MYTENNIS — аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500&family=Inter:wght@600&family=Onest:wght@400;500&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ececec;
    --ink: #0d0d0d;
    --secondary: rgba(13, 13, 13, 0.66);
    --tertiary: rgba(13, 13, 13, 0.6);
    --card: rgba(255, 255, 255, 0.92);
    --panel: #fff;
    --cobalt: #2e3dff;
    --cobalt-line: #2f3dff;
    --flap-top: #0d0d0d;
    --flap-bottom: #242424;
    --lime: #eaff00;
    --success: #00754e;
    --success-surface: #c7f0e2;
    --danger: #b8231a;
    --clay: #d92d20;
    --loss-surface: #f6d5d2;
    --nav: #0d0d0d;
    --nav-idle: rgba(255, 255, 255, 0.72);
    --radius-s: 12px;
    --radius-l: 28px;
    --push: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #d5d5d5;
    color: var(--ink);
    font-family: Onest, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 28px 16px 40px;
  }
  .device {
    position: relative;
    width: 414px;
    height: 868px;
    padding: 12px;
    border-radius: 62px;
    background: linear-gradient(135deg, #8b8b90 0%, #323235 16%, #9a9a9f 32%, #2c2c2f 50%, #1b1b1e 68%, #6a6a6f 84%, #2a2a2d 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.7), 0 40px 80px rgba(30, 40, 120, 0.28), 0 14px 30px rgba(13, 13, 13, 0.22);
  }
  .device::before { content: ""; position: absolute; inset: 4px; border-radius: 58px; background: #050505; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05); }
  .hw { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #4d4d52, #8d8d92 55%, #3a3a3e); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
  .hw.act { left: -3px; top: 132px; height: 32px; }
  .hw.up { left: -3px; top: 196px; height: 60px; }
  .hw.down { left: -3px; top: 270px; height: 60px; }
  .hw.pwr { right: -3px; top: 232px; height: 96px; background: linear-gradient(270deg, #4d4d52, #8d8d92 55%, #3a3a3e); }
  .island { position: absolute; z-index: 40; top: 23px; left: 50%; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; pointer-events: none; }
  .island::after { content: ""; position: absolute; right: 16px; top: 11px; width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #1d2d4a 0%, #0a1020 45%, #000 70%); box-shadow: 0 0 0 1.5px #0d0d10; }
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: radial-gradient(55% 50% at 50% 54%, rgba(46, 61, 255, 0.24) 0%, rgba(46, 61, 255, 0.09) 50%, rgba(46, 61, 255, 0) 78%), #eceef5; }
  .bg svg { position: absolute; display: block; }
  .bg .court { inset: 0; width: 100%; height: 100%; }
  .stage { position: relative; z-index: 1; }
  .screen-clip {
    position: relative;
    z-index: 1;
    width: 390px;
    height: 844px;
    overflow: hidden;
    border-radius: 50px;
    background: var(--bg);
  }
  .stack { position: absolute; inset: 0; }
  .scroll-inner { contain: layout style; will-change: transform; }
  .screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    will-change: transform;
    box-shadow: -16px 0 32px rgba(0, 0, 0, 0.12);
  }
  .screen.is-home { box-shadow: none; }
  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: none;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    touch-action: none;
    cursor: grab;
  }
  .scroll.is-dragging { cursor: grabbing; }
  .scroll img {
    -webkit-user-drag: none;
    user-select: none;
    pointer-events: none;
  }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll-inner { min-height: 100%; }
  .screen > .status,
  .screen > .topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 40;
    pointer-events: none;
  }
  .topbar.is-scrolled { background: #ececec; }
  .topbar .nav-slot {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ececec;
    opacity: 0;
    pointer-events: none;
  }
  .topbar .inline-title {
    margin: 0;
    font-family: Geologica, sans-serif;
    font-weight: 500;
    font-size: 17px;
    line-height: 22px;
  }
  .dhero-stick {
    position: sticky;
    top: 0;
    z-index: 8;
    background: var(--cobalt);
    color: #fff;
  }
  .dhero-rest {
    position: relative;
        z-index: 0;
        background: var(--cobalt);
    color: #fff;
    border-radius: 0 0 28px 28px;
    padding-bottom: 24px;
  }
  .ios-bar {
    position: absolute;
    top: 70px;
    right: 3px;
    width: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 0.5px rgba(13, 13, 13, 0.28);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: opacity 480ms linear;
  }
  .ios-bar.on { opacity: 1; transition: none; }
  .home-pad { padding-bottom: 134px; display: flex; flex-direction: column; gap: 20px; }
  .detail-pad { padding-bottom: 48px; display: flex; flex-direction: column; gap: 20px; }

  .is-home .scroll-inner { padding-top: 62px; }
  .status-space { height: 62px; flex: none; }
  .status {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px 0;
  }
  .status time {
    font-family: Inter, sans-serif;
    font-weight: 600;
    font-size: 17px;
    line-height: 22px;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; }
  .status-icons img { display: block; }
  .status.on-cobalt, .status.on-cobalt time { color: #fff; }

  .large-title {
    margin: 0;
    padding: 0 16px;
    font-family: Geologica, sans-serif;
    font-weight: 500;
    font-size: 34px;
    line-height: 41px;
  }
  .px { padding-left: 16px; padding-right: 16px; }

  .home-head { display: flex; align-items: center; justify-content: space-between; padding-right: 16px; }
  .home-head .large-title { padding-right: 0; }
  .avatar-btn { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex: none; transition: transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-btn:active { transform: scale(0.92); }
  .chart .mdot { position: absolute; width: 8px; height: 8px; }
  .is-home .panel { background: var(--cobalt); padding-bottom: 20px; }
  .panel .chart-caption { color: rgba(255, 255, 255, 0.82); }
  .panel .chart .ylab { color: rgba(255, 255, 255, 0.82); }
  .panel .chart .scrub { background: rgba(255, 255, 255, 0.3); }
  .panel .months span, .panel .months button { color: rgba(255, 255, 255, 0.75); }
  .panel .months button.on { color: var(--lime); }
  .panel .insight { background: #fff; }
  .panel .insight .mark { background: var(--lime); }
  .tile .tile-head .bubble { background: #f2f2f2; }
  .tile .tile-head .bubble img { filter: brightness(0); }
  .detail-pad { padding-top: 20px; }

  .player {
    width: 100%;
    height: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 12px 12px;
    background: var(--card);
    border-radius: var(--radius-l);
    text-align: left;
  }
  .player img.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .player .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .player .name { font-weight: 500; font-size: 17px; line-height: 22px; }
  .player .city { font-size: 15px; line-height: 20px; color: var(--secondary); }
  .player:active { transform: scale(0.97); }

  .hero-level {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 84px;
  }
  .digits { display: flex; align-items: center; gap: 8px; }
  .flap {
    position: relative;
    width: 60px;
    height: 84px;
    border-radius: 12px;
    overflow: hidden;
    background: linear-gradient(var(--flap-top) 0 42px, #fff 41px 43px, var(--flap-bottom) 42px 84px);
  }
  .flap span {
    position: absolute;
    left: 12px;
    top: 6px;
    font-family: Geologica, sans-serif;
    font-weight: 400;
    font-size: 60px;
    line-height: 72px;
    color: #fff;
  }
  .flap { perspective: 320px; }
  .flap .h { position: absolute; left: 0; width: 60px; height: 42px; overflow: hidden; backface-visibility: hidden; }
  .flap .h.t { top: 0; }
  .flap .h.b { top: 42px; }
  .flap .h.t span { top: 6px; }
  .flap .h.b span { top: -36px; }
  .flap .h.fl-t { background: var(--flap-top); z-index: 2; transform-origin: 50% 100%; box-shadow: 0 1px 0 #fff; }
  .flap .h.fl-b { background: var(--flap-bottom); z-index: 2; transform-origin: 50% 0; }
  .flap i {
    z-index: 3;
    position: absolute;
    top: 38px;
    width: 2px;
    height: 8px;
    background: #fff;
    border-radius: 1px;
  }
  .flap i.l { left: 0; }
  .flap i.r { right: 0; }
  .decimal { width: 12px; height: 84px; display: block; }
  .level-info { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .level-info p { margin: 0; font-size: 15px; line-height: 20px; color: var(--secondary); }
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 12px;
    border-radius: 100px;
    background: var(--success-surface);
    color: var(--success);
    font-weight: 500;
    font-size: 15px;
    line-height: 20px;
  }

  .panel {
    background: var(--panel);
    border-radius: var(--radius-l);
    padding: 20px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chart-caption {
    margin: 0;
    padding: 0 16px;
    font-size: 15px;
    line-height: 20px;
    color: var(--secondary);
  }
  .chart {
    position: relative;
    height: 260px;
    overflow: hidden;
  }
  .chart .area { position: absolute; left: 25px; top: 84px; width: 308px; height: 218px; }
  .chart .grid { position: absolute; left: 0; top: -30px; width: 358px; height: 344px; }
  .chart .line { position: absolute; left: 25px; top: 84px; width: 308px; height: 105px; }
  .chart .hit {
    position: absolute;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    z-index: 3;
  }
  .chart .halo,
  .chart .pdot,
  .chart .scrub,
  .chart .tooltip {
    transition: left 180ms cubic-bezier(0.32, 0.72, 0, 1), top 180ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .chart .mdot.is-off { visibility: hidden; }
  .chart .scrub {
    position: absolute;
    left: 332px;
    top: 58px;
    width: 1px;
    height: 198px;
    background: rgba(13, 13, 13, 0.28);
  }
  .chart .halo { position: absolute; left: 323px; top: 74px; width: 20px; height: 20px; }
  .chart .pdot { position: absolute; left: 327px; top: 78px; width: 12px; height: 12px; }
  .chart .ylab {
    position: absolute;
    left: 16px;
    margin: 0;
    font-size: 12px;
    line-height: 16px;
    color: var(--tertiary);
  }
  .tooltip {
    position: absolute;
    left: 217px;
    top: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 16px;
    border-radius: 100px;
    background: var(--lime);
    font-size: 15px;
    line-height: 20px;
    white-space: nowrap;
  }
  .tooltip b { font-weight: 500; }
  .months {
    position: relative;
    height: 44px;
    margin: 0 16px;
  }
  .months span,
  .months button {
    position: absolute;
    top: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 18px;
    color: var(--secondary);
  }
  .months span.on,
  .months button.on { color: var(--cobalt); }

  .panel > .insight { margin: 0 16px; }
  .sheet .insight { margin: 0 16px; }
  .px > .insight { margin: 0; }
  .insight {
    min-height: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: var(--radius-s);
    background: var(--lime);
  }
  .insight .mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    display: grid;
    place-items: center;
    flex: none;
  }
  .insight .mark img { width: 24px; height: 24px; }
  .insight p { margin: 0; font-size: 15px; line-height: 20px; }

  .tile-row { display: flex; gap: 4px; }
  .tile {
    flex: 1;
    min-width: 0;
    min-height: 134px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding: 16px;
    border-radius: var(--radius-l);
    background: var(--card);
    text-align: left;
  }
  .tile-head { display: flex; align-items: center; gap: 8px; width: 100%; }
  .tile-head .bubble {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--cobalt);
    display: grid;
    place-items: center;
    flex: none;
  }
  .tile-head img { width: 24px; height: 24px; }
  .tile-head span { font-weight: 500; font-size: 15px; line-height: 20px; }
  .tile strong {
    display: block;
    font-family: Geologica, sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 28px;
  }
  .tile em {
    display: block;
    font-style: normal;
    font-size: 13px;
    line-height: 18px;
    color: var(--secondary);
  }
  .tile em.success { color: var(--success); }
  button.tile,
  .player,
  .tab,
  .back,
  .iconbtn,
  .primary,
  .seg button,
  .chip-period,
  .chip-on {
    transition: transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  button.tile:active { transform: scale(0.96); }
  .overview { display: flex; flex-direction: column; gap: 4px; }

  .tabbar {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 42px;
    height: 72px;
    display: flex;
    padding: 8px;
    border-radius: 36px;
    background: var(--nav);
    z-index: 3;
  }
  .tab {
    flex: 1;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--nav-idle);
    font-size: 13px;
    line-height: 18px;
  }
  .tab img { width: 24px; height: 24px; }
  .tab.on { color: var(--lime); font-weight: 500; }
  .tab .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--lime); }
  .tab:active { transform: scale(0.96); }
  .home-indicator {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    height: 5px;
    display: flex;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
  }
  .home-indicator i {
    width: 144px;
    height: 5px;
    border-radius: 100px;
    background: rgba(13, 13, 13, 0.9);
  }
  .screen.detail .home-indicator i { background: rgba(13, 13, 13, 0.9); }

  .dnav {
    position: relative;
    height: 64px;
    display: flex;
    align-items: center;
    padding: 4px 16px;
  }
  .dnav h1 {
    position: absolute;
    left: 0;
    right: 0;
    top: 19.5px;
    margin: 0;
    text-align: center;
    font-family: Geologica, sans-serif;
    font-weight: 500;
    font-size: 20px;
    line-height: 25px;
    pointer-events: none;
  }
  .back {
    position: relative;
    z-index: 1;
    width: 44px;
    height: 44px;
    margin-left: -2px;
    display: grid;
    place-items: center;
  }
  .back span {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    display: grid;
    place-items: center;
  }
  .back img { width: 24px; height: 24px; display: block; }
  .back:active { transform: scale(0.92); }
  .dvalue {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 72px;
    padding: 0 16px;
    overflow: hidden;
  }
  .dvalue .display {
    margin: 0;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 60px;
    line-height: 60px;
  }
  .dvalue .lead { display: flex; align-items: center; gap: 12px; }
  .dcaption {
    margin: 0;
    padding: 8px 16px 0;
    font-size: 15px;
    line-height: 20px;
    color: rgba(255, 255, 255, 0.82);
  }
  .chip-on {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 12px 12px 12px 16px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.22);
    color: #fff;
    font-weight: 500;
    font-size: 15px;
    line-height: 20px;
  }
  .chip-on img { width: 24px; height: 24px; }

  .detail-pad { padding-bottom: 54px; display: flex; flex-direction: column; gap: 20px; }
  .sheet {
    background: #fff;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
  }
  .sheet.wins { padding: 16px 0 20px; gap: 8px; }
  .sheet.matches, .sheet.surface { padding: 20px 0; gap: 8px; }
  .sheet.opponents { padding: 0 0 20px; gap: 8px; border-radius: 28px; overflow: hidden; }
  .period {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 12px 0 4px;
  }
  .period p {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    margin: 0;
    text-align: center;
    font-size: 15px;
    line-height: 20px;
  }
  .iconbtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    display: grid;
    place-items: center;
    flex: none;
  }
  .iconbtn img { width: 24px; height: 24px; }
  .iconbtn:active { transform: scale(0.92); }
  .iconbtn:disabled { opacity: 0.3; pointer-events: none; }
  .chip-period {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 12px 12px 12px 16px;
    border-radius: 100px;
    background: rgba(13, 13, 13, 0.06);
    font-weight: 500;
    font-size: 15px;
    line-height: 20px;
    flex: none;
  }
  .chip-period img { width: 24px; height: 24px; }
  .period-menu {
    position: absolute;
    z-index: 40;
    width: 196px;
    padding: 4px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 12px 40px rgba(13, 13, 13, 0.18);
    transform-origin: top right;
    animation: menu-in 180ms cubic-bezier(0.32, 0.72, 0, 1);
  }
  .period-menu button {
    width: 100%;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 17px;
    line-height: 22px;
    text-align: left;
  }
  .period-menu button.on { font-weight: 500; }
  .period-menu button.on::after {
    content: "";
    width: 7px;
    height: 12px;
    margin-top: -2px;
    border-right: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    transform: rotate(45deg);
  }
  @keyframes menu-in {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: none; }
  }

  .scale {
    display: flex;
    justify-content: space-between;
    padding: 12px 16px 12px;
    font-size: 13px;
    line-height: 18px;
    color: var(--secondary);
  }
  .metric { display: flex; flex-direction: column; gap: 4px; padding: 0 16px 16px; }
  .metric .lab {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    line-height: 20px;
  }
  .metric .lab b { font-weight: 500; }

<script>
(function () {
  const D = window.MYTENNIS;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PUSH = "transform 350ms cubic-bezier(0.32, 0.72, 0, 1)";
  const ZOOM = "clip-path 460ms cubic-bezier(0.32, 0.72, 0, 1)";
  const ZOOM_BACK = "transform 460ms cubic-bezier(0.32, 0.72, 0, 1)";
  const zoomFrom = {};
  const stackEl = document.getElementById("stack");
  const history = ["home"];
  let dragging = false;
  let lock = false;

  function status(tone) {
    const light = tone === "light";
    const cell = light ? "cellular-light" : "cellular";
    const wifi = light ? "wifi-light" : "wifi";
    const battery = light ? "battery-light" : "battery";
    return `<div class="status${light ? " on-cobalt" : ""}">
      <time>9:41</time>
      <div class="status-icons">
        <img src="assets/${cell}.svg" width="19" height="12" alt="">
        <img src="assets/${wifi}.svg" width="17" height="12" alt="">
        <img src="assets/${battery}.svg" width="27" height="13" alt="">
      </div>
    </div>`;
  }

  function indicator() {
    return `<div class="home-indicator"><i></i></div>`;
  }

  function insight(slot, text) {
    return `<div class="insight"><div class="mark"><img src="assets/insight.svg" alt=""></div><p data-slot="${slot}">${text}</p></div>`;
  }

  function tiles(items, linked) {
    const rows = [items.slice(0, 2), items.slice(2)];
    return `<div class="overview">${rows.filter(r => r.length).map(row => `
      <div class="tile-row">${row.map(t => `
        <${linked ? "button" : "div"} class="tile"${linked ? ` data-push="${t.id}" type="button"` : ""}>
          <div class="tile-head">
            ${t.icon ? `<div class="bubble"><img src="${t.icon}" alt=""></div>` : ""}
            <span>${t.title}</span>
          </div>
          <div>
            <strong>${t.value}</strong>
            <em class="${t.noteTone || ""}">${t.note}</em>
          </div>
        </${linked ? "button" : "div"}>`).join("")}</div>`).join("")}</div>`;
  }

  function matchRows(rows) {
    return `<div class="match-list">${rows.map(r => `
      <div class="match">
        <div class="result ${r.result}" aria-hidden="true"><img src="assets/${r.result === "win" ? "thumb-up" : "thumb-down"}.svg" alt=""></div>
        <div class="info">
          <div class="name">${r.name}</div>
          <div class="meta">${r.meta}</div>
        </div>
        <div class="when">
          <div class="score">${r.score}</div>
          <div class="date">${r.date}</div>
        </div>
      </div>`).join("")}</div>`;
  }

  function backBtn() {
    return `<button class="back" type="button" data-pop aria-label="Назад"><span><img src="assets/chevron-left.svg" alt=""></span></button>`;
  }

  const MONTH_TOTAL = D.series.ntrp.length;
  D.offset = 0;
  const MONTH_NAMES = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
  const monthAt = g => {
    const k = D.start.m + g;
    return { name: MONTH_NAMES[k % 12], y: D.start.y + Math.floor(k / 12) };
  };
  function periodLabel(per) {
    const n = Number(per.id);
    const end = MONTH_TOTAL - 1 - D.offset;
    const a = monthAt(end - n + 1), b = monthAt(end);
    return `${a.name} ${a.y} – ${b.name} ${b.y}`;
  }

  function periodNow() {
    return D.periods.find(item => item.id === D.periodId) || D.periods[1];
  }

  function periodRow() {
    const period = periodNow();
    return `<div class="period">
      <button class="iconbtn" type="button" data-shift="-1" aria-label="Назад по периоду"><img src="assets/chevron-left.svg" alt=""></button>
      <p data-period-label>${periodLabel(period)}</p>
      <button class="iconbtn" type="button" data-shift="1" aria-label="Вперёд по периоду"><img src="assets/chevron-right.svg" alt=""></button>
      <button class="chip-period" type="button" data-period-open aria-haspopup="menu" aria-expanded="false">${period.chip}<img src="assets/chevron-updown.svg" alt=""></button>
    </div>`;
  }

  /* ---------- данные периода ---------- */
  const num = n => String(n).replace(".", ",");
  const pct = (w, t) => Math.round(w / t * 100);
  const plural = (n, a, b, c) => {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
    return c;
  };

  /* показатели периода: для текущего окна из data.js, для сдвинутых считаются от него */
  function periodStats(id, off, total, ntrp) {
    const base = D.stats[id];
    const delta = num(((ntrp[ntrp.length - 1] - ntrp[0]) * 10 / 10).toFixed(1));
    if (off === 0) return Object.assign({}, base, { ntrpDelta: delta });
    const wob = (k, m) => ((off * k) % m) - Math.floor(m / 2);
    const t0 = Math.round(total * base.opp[0].t / base.wins.t);
    const t1 = Math.round(total * base.opp[1].t / base.wins.t);
    const ts = [t0, t1, Math.max(0, total - t0 - t1)];
    const opp = ts.map((t, i) => {
      const f = base.opp[i].w / base.opp[i].t;
      const w = Math.min(t, Math.max(0, Math.round(t * f + wob(i + 2, 3) * 0.4)));
      return { w, t };
    });
    const w = opp.reduce((a, o) => a + o.w, 0);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    return {
      ntrpDelta: delta,
      winsDelta: `+${[3, 5, 2, 4, 1][off % 5]} п.п.`,
      wins: { w, t: total },
      bars: base.bars.map((b, i) => clamp(b + wob(i + 3, 7), 25, 90)),
      opp,
      surface: { hard: clamp(base.surface.hard + wob(5, 9), 30, 90), clay: clamp(base.surface.clay + wob(3, 7), 30, 90) }
    };
  }

  function model(id, offset = D.offset) {
    const n = Number(id);
    const per = D.periods.find(p => p.id === id) || D.periods[1];
    const off = offset, end = MONTH_TOTAL - off, start = end - n;
    const labels = [];
    for (let g = start; g < end; g++) labels.push(monthAt(g).name);
    const ntrp = D.series.ntrp.slice(start, end);
    const cnt = D.series.matches.slice(start, end);
    const total = cnt.reduce((a, b) => a + b, 0);
    const peak = Math.max(...cnt);
    const peakI = cnt.indexOf(peak);
    const st = periodStats(id, off, total, ntrp);
    const winPct = pct(st.wins.w, st.wins.t);
    const barAvg = Math.round(st.bars.reduce((a, b) => a + b, 0) / st.bars.length);
    const best = st.surface.hard >= st.surface.clay ? "hard" : "clay";
    return { id, n, off, per, st, labels, ntrp, cnt, total, peak, peakI, winPct, barAvg, best, start, end, avg: (Math.round(total / n * 10) / 10).toFixed(1) };
  }

  function pickMatches(vm, filter) {
    return D.pool
      .filter(r => r.m >= vm.start && r.m < vm.end && filter(r))
      .sort((a, b) => b.m - a.m || b.day - a.day)
      .slice(0, 3);
  }

  function homeInsight(vm) {
    const v = vm.ntrp;
    const gains = v.slice(1).map((x, i) => Math.round((x - v[i]) * 10));
    const up = gains.filter(g => g > 0).length;
    if (v[v.length - 1] - v[0] <= 0) return `Уровень держался на ${num(v[v.length - 1].toFixed(1))} ${vm.per.za}`;
    const head = `Вырос на ${vm.st.ntrpDelta} ${vm.per.za}`;
    if (up === gains.length) return `${head}, рост каждый месяц`;
    if (up / gains.length >= 0.75) return `${head}, рост был почти каждый месяц`;
    const total = v[v.length - 1] - v[0];
    for (let k = 1; k < v.length; k++) {
      if (v[v.length - 1] - v[v.length - 1 - k] >= total * 0.66 - 1e-9) {
        return `${head}, основной рост пришёлся на последние ${k} ${plural(k, "месяц", "месяца", "месяцев")}`;
      }
    }
    return head;
  }

  /* ---------- линейный график ---------- */
  const charts = {};

  function ticksFor(min, max, steps) {
    for (const step of steps) {
      for (const count of [4, 5]) {
        const bottom = Math.floor(min / step + 1e-9) * step;
        const top = bottom + (count - 1) * step;
        if (top >= max + step * 0.5 - 1e-9) return { bottom, step, count };
      }
    }
    const step = steps[steps.length - 1];
    return { bottom: Math.floor(min / step) * step, step, count: 5 };
  }

  function smooth(p) {
    const n = p.length;
    const dx = [], m = [], t = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / dx[i]; }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / m[i], b = t[i + 1] / m[i], k = a * a + b * b;
      if (k > 9) { const r = 3 / Math.sqrt(k); t[i] = r * a * m[i]; t[i + 1] = r * b * m[i]; }
    }
    let d = `M ${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const h = dx[i] / 3;
      d += ` C ${(p[i].x + h).toFixed(1)} ${(p[i].y + t[i] * h).toFixed(1)} ${(p[i + 1].x - h).toFixed(1)} ${(p[i + 1].y - t[i + 1] * h).toFixed(1)} ${p[i + 1].x.toFixed(1)} ${p[i + 1].y.toFixed(1)}`;
    }
    return d;
  }

  function lineChart(id, labels, values, o) {
    const t = ticksFor(Math.min(...values), Math.max(...values), o.steps);
    const top = t.bottom + (t.count - 1) * t.step;
    const X0 = 25.4, X1 = 332.6, GAP = 52.3, Y0 = 31.5, n = values.length;
    const pts = values.map((v, i) => ({
      label: labels[i],
      text: o.text(v),
      tip: o.tip ? o.tip(i) : "",
      x: X0 + i * (X1 - X0) / (n - 1),
      y: Y0 + (top - v) / t.step * GAP
    }));
    charts[id] = { pts, sel: o.select };
    const line = smooth(pts);
    const area = `${line} L ${pts[n - 1].x.toFixed(1)} 260 L ${pts[0].x.toFixed(1)} 260 Z`;
    const grid = Array.from({ length: t.count }, (_, k) => `<path d="M16 ${(Y0 + k * GAP).toFixed(1)}H342" stroke="url(#gr-${id})"/>`).join("");
    const ylabs = Array.from({ length: t.count }, (_, k) => {
      const val = top - k * t.step;
      return `<p class="ylab" style="top:${(Y0 + k * GAP + 3).toFixed(1)}px">${o.tick(val)}</p>`;
    }).join("");
    const dense = n > 8 ? " dense" : "";
    return `<div class="chart" data-chart="${id}">
        <svg class="plot" width="358" height="260" viewBox="0 0 358 260" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="gr-${id}" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="342" y2="0">
              <stop offset="0" style="stop-color:var(--lc-grid);stop-opacity:0"/>
              <stop offset="0.2" style="stop-color:var(--lc-grid);stop-opacity:var(--lc-grid-o)"/>
              <stop offset="0.8" style="stop-color:var(--lc-grid);stop-opacity:var(--lc-grid-o)"/>
              <stop offset="1" style="stop-color:var(--lc-grid);stop-opacity:0"/>
            </linearGradient>
            <linearGradient id="ar-${id}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" style="stop-color:var(--lc-area);stop-opacity:var(--lc-area-o)"/>
              <stop offset="1" style="stop-color:var(--lc-area);stop-opacity:0"/>
            </linearGradient>
          </defs>
          ${grid}
          <path d="${area}" fill="url(#ar-${id})"/>
          <path class="ln" d="${line}"/>
        </svg>
        ${pts.map((p, i) => `<i class="mdot" data-dot="${i}" style="left:${(p.x - 4).toFixed(1)}px;top:${(p.y - 4).toFixed(1)}px"></i>`).join("")}
        <i class="scrub"></i><i class="halo"></i><i class="pdot"></i>
        ${ylabs}
        <div class="tooltip"><span></span><b></b></div>
        ${pts.map((p, i) => `<button class="hit" type="button" data-cp="${id}:${i}" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px" aria-label="${p.tip || p.label} ${p.text}"></button>`).join("")}
      </div>
      <div class="months${dense}">
        ${pts.map((p, i) => `<button type="button" data-cp="${id}:${i}" style="left:${(p.x - 16).toFixed(1)}px">${p.label}</button>`).join("")}
      </div>`;
  }

  function selectPoint(id, index) {
    const c = charts[id];
    const chart = document.querySelector(`[data-chart="${id}"]`);
    if (!c || !chart || !c.pts[index]) return;
    const p = c.pts[index];
    const q = sel => chart.querySelector(sel);
    q(".halo").style.left = (p.x - 14) + "px";
    q(".halo").style.top = (p.y - 14) + "px";
    q(".pdot").style.left = (p.x - 10) + "px";
    q(".pdot").style.top = (p.y - 10) + "px";
    const scrub = q(".scrub");
    const sTop = Math.max(0, p.y - 27);
    scrub.style.left = (p.x - 0.5) + "px";
    scrub.style.top = sTop + "px";
    scrub.style.height = (256 - sTop) + "px";
    const tip = q(".tooltip");
    tip.querySelector("span").textContent = p.tip || p.label;
    tip.querySelector("b").textContent = p.text;
    const showMonth = id !== "home";
    const width = tip.offsetWidth || (32 + 8.6 * (p.text.length + (showMonth ? (p.tip || p.label).length : 0)) + (showMonth ? 8 : 0));
    tip.style.left = Math.max(8, Math.min(358 - width - 8, p.x - width / 2)) + "px";
    tip.style.top = Math.max(8, p.y - 68) + "px";
    chart.querySelectorAll(".mdot").forEach(node => {
      node.classList.toggle("is-off", Number(node.dataset.dot) === index);
    });
    chart.parentElement.querySelectorAll(".months [data-cp]").forEach(node => {
      node.classList.toggle("on", Number(node.dataset.cp.split(":")[1]) === index);
    });
    c.cur = index;
  }

  function refreshCharts() {
    Object.keys(charts).forEach(id => selectPoint(id, charts[id].cur != null ? charts[id].cur : charts[id].sel));
  }

  /* ---------- дуги покрытия ---------- */
  function arcPath(cx, cy, r, sweep) {
    const a0 = 135 * Math.PI / 180;
    const a1 = (135 + Math.max(1, sweep)) * Math.PI / 180;
    const f = x => x.toFixed(2);
    return `M ${f(cx + r * Math.cos(a0))} ${f(cy + r * Math.sin(a0))} A ${r} ${r} 0 ${sweep > 180 ? 1 : 0} 1 ${f(cx + r * Math.cos(a1))} ${f(cy + r * Math.sin(a1))}`;
  }

  function arcsSvg(hard, clay) {
    const cx = 179, cy = 88;
    const stroke = `stroke-width="16" stroke-linecap="round" fill="none"`;
    return `<svg class="arcs-svg" width="358" height="238" viewBox="0 0 358 238" aria-hidden="true">
      <defs>
        <linearGradient id="arc-h" gradientUnits="userSpaceOnUse" x1="0" y1="4.4" x2="0" y2="147.4"><stop stop-color="#2F3DFF"/><stop offset="1" stop-color="#2F3DFF" stop-opacity="0.1"/></linearGradient>
        <linearGradient id="arc-c" gradientUnits="userSpaceOnUse" x1="185" y1="26" x2="140.5" y2="132"><stop stop-color="#FF5900"/><stop offset="1" stop-color="#FF5900" stop-opacity="0.1"/></linearGradient>
      </defs>
      <path d="${arcPath(cx, cy, 83.6, 270)}" ${stroke} stroke="#0D0D0D" stroke-opacity="0.04"/>
      <path d="${arcPath(cx, cy, 83.6, hard / 100 * 270)}" ${stroke} stroke="url(#arc-h)"/>
      <path d="${arcPath(cx, cy, 62, 270)}" ${stroke} stroke="#0D0D0D" stroke-opacity="0.04"/>
      <path d="${arcPath(cx, cy, 62, clay / 100 * 270)}" ${stroke} stroke="url(#arc-c)"/>
    </svg>`;
  }

  /* ---------- слоты, которые пересобираются при смене периода ---------- */
  const slots = {
    "home-delta": vm => `${vm.st.ntrpDelta === "0,0" ? "" : "▲ "}${vm.st.ntrpDelta} ${vm.per.zaShort}`,
    "home-caption": vm => `Динамика уровня NTRP ${vm.per.za}`,
    "home-chart": vm => lineChart("home", vm.labels, vm.ntrp, {
      steps: [0.1, 0.2, 0.5],
      text: v => v.toFixed(1),
      tick: v => v.toFixed(1),
      tip: i => (i === vm.n - 1 && vm.off === 0 ? "Сегодня" : ""),
      select: vm.n - 1
    }),
    "home-insight": vm => homeInsight(vm),
    "home-tiles": vm => tiles([
      { id: "wins", icon: "assets/icon-trophy.svg", title: "Победы", value: `${vm.winPct} %`, note: `▲ ${vm.st.winsDelta.replace("+", "")} ${vm.per.zaShort}`, noteTone: "success" },
      { id: "matches", icon: "assets/icon-matches.svg", title: "Матчи", value: String(vm.total), note: vm.per.za, noteTone: "secondary" },
      { id: "opponents", icon: "assets/icon-opponents.svg", title: "Соперники", value: `${vm.st.opp[2].w} из ${vm.st.opp[2].t}`, note: "побед против сильных", noteTone: "secondary" },
      { id: "surface", icon: "assets/icon-surface.svg", title: "Покрытие", value: vm.best === "hard" ? "Хард" : "Грунт", note: `лучшее, ${vm.st.surface[vm.best]} % побед`, noteTone: "secondary" }
    ], true),

    "matches-value": vm => String(vm.total),
    "matches-caption": vm => `матчей ${vm.per.za}`,
    "matches-chart": vm => lineChart("matches", vm.labels, vm.cnt, {
      steps: [1, 2, 5, 10],
      text: v => `${v} ${plural(v, "матч", "матча", "матчей")}`,
      tick: v => String(Math.round(v)),
      tip: i => vm.labels[i],
      select: vm.peakI
    }),
    "matches-insight": vm => `Пик ${D.loc[vm.labels[vm.peakI]]}: ${vm.peak} ${plural(vm.peak, "матч", "матча", "матчей")}, в среднем ${num(vm.avg)} в месяц`,
    "matches-tiles": vm => tiles([
      { icon: "assets/icon-avg.svg", title: "В среднем", value: num(vm.avg), note: "матча в месяц" },
      { icon: "assets/icon-max.svg", title: "Максимум", value: String(vm.peak), note: D.loc[vm.labels[vm.peakI]] }
    ], false),

    "wins-value": vm => `${vm.winPct} %`,
    "wins-delta": vm => vm.st.winsDelta,
    "wins-caption": vm => `побед ${vm.per.za}`,
    "wins-body": vm => {
      const bars = D.barDefs.map((def, i) => {
        const value = vm.st.bars[i];
        const diff = value - vm.barAvg;
        const width = Math.max(4, Math.abs(diff) * 7.5);
        const side = diff >= 0 ? "right" : "left";
        const left = side === "right" ? 179 : 179 - width;
        return `
          <div class="metric">
            <div class="lab"><span>${def.label}</span><b>${value} %</b></div>
            <div class="track">
              <i class="base"></i>
              <i class="fill ${side}" style="left:${(left / 358) * 100}%;width:${(width / 358) * 100}%"></i>
              <i class="tick"></i>
            </div>
          </div>`;
      }).join("");
      return `<div class="scale"><span>слабее</span><span>среднее по метрикам ${vm.barAvg} %</span><span>сильнее</span></div>${bars}`;
    },
    "wins-insight": vm => {
      const v = vm.st.bars;
      const hi = v.indexOf(Math.max(...v));
      const lo = v.indexOf(Math.min(...v));
      const dh = D.barDefs[hi], dl = D.barDefs[lo];
      return `Сильнее всего ${dh.key}: ${v[hi]} %. Слабее всего ${dl.key}: ${v[lo]} %, над ${dl.plural ? "ними" : "ним"} стоит поработать`;
    },
    "wins-tiles": vm => tiles([
      { icon: "assets/icon-trophy.svg", title: "Победы", value: `${vm.st.wins.w} из ${vm.st.wins.t}`, note: `${vm.winPct} % ${vm.per.za}` },
      { icon: "assets/icon-max.svg", title: "Поражения", value: `${vm.st.wins.t - vm.st.wins.w} из ${vm.st.wins.t}`, note: `${100 - vm.winPct} % ${vm.per.za}` }
    ], false),

    "opp-caption": vm => "побед против сильнее вас",
    "opp-value": vm => `${pct(vm.st.opp[2].w, vm.st.opp[2].t)} %`,
    "opp-table": vm => {
      const rows = D.oppDefs.map((def, i) => {
        const r = vm.st.opp[i];
        return `
          <div class="grow">
            <div class="g-name"><b>${def.name}</b><span>${def.range}</span></div>
            <div class="g-count">${r.w} из ${r.t}</div>
            <div class="g-pct ${def.tone}">${pct(r.w, r.t)} %</div>
          </div>`;
      }).join("");
      return `
        <div class="ghead"><span class="g-name">Уровень соперника</span><span class="g-count">Побед</span><span class="g-pct">%</span></div>
        ${rows}
        <div class="grow total">
          <div class="g-name"><b>Всего</b></div>
          <div class="g-count">${vm.st.wins.w} из ${vm.st.wins.t}</div>
          <div class="g-pct ink">${vm.winPct} %</div>
        </div>`;
    },
    "opp-insight": vm => `Против слабых вы выигрываете ${vm.st.opp[0].w} из ${vm.st.opp[0].t}, против сильных ${vm.st.opp[2].w} из ${vm.st.opp[2].t}. Больше всего места для роста`,
    "opp-list": vm => matchRows(pickMatches(vm, r => r.strong)),

    "surf-value": vm => (vm.best === "hard" ? "Хард" : "Грунт"),
    "surf-caption": vm => `лучшее покрытие, ${vm.st.surface[vm.best]} % побед`,
    "surf-arcs": vm => {
      const s = vm.st.surface;
      return `${arcsSvg(s.hard, s.clay)}
        <p class="val">${s[vm.best]} %</p>
        <p class="note">${vm.best === "hard" ? "хард" : "грунт"}</p>
        <div class="legend">
          <i><img src="assets/dot-hard.svg" alt="">хард <b class="brand">${s.hard} %</b></i>
          <i><img src="assets/dot-clay.svg" alt="">грунт <b class="clay">${s.clay} %</b></i>
        </div>`;
    },
    "surf-insight": vm => {
      const s = vm.st.surface;
      const win = vm.best === "hard" ? "харде" : "грунте";
      const lose = vm.best === "hard" ? "грунте" : "харде";
      const other = vm.best === "hard" ? s.clay : s.hard;
      return `На ${win} вы выигрываете чаще: ${s[vm.best]} % против ${other} % на ${lose}`;
    },
    "surf-list": vm => {
      const active = stackEl.querySelector("[data-surface].on");
      const which = active ? active.dataset.surface : "hard";
      return matchRows(pickMatches(vm, r => r.surface === which));
    }
  };

  function slot(name, vm, tag, cls) {
    return `<${tag || "span"} data-slot="${name}"${cls ? ` class="${cls}"` : ""}>${slots[name](vm)}</${tag || "span"}>`;
  }

  /* главная всегда показывает последние 6 месяцев, период на ней не меняется */
  function fillSlots(vm, only) {
    const homeVm = model("6", 0);
    const before = only ? null : numberEls().map(el => el.textContent);
    const oldPts = {};
    Object.keys(charts).forEach(id => { oldPts[id] = charts[id].pts; });
    stackEl.querySelectorAll("[data-slot]").forEach(node => {
      if (only && node.dataset.slot !== only) return;
      const fn = slots[node.dataset.slot];
      if (fn) node.innerHTML = fn(node.dataset.slot.startsWith("home-") ? homeVm : vm);
    });
    refreshChartsDefault();
    window.dispatchEvent(new Event("resize"));
    if (before) animateUpdate(before, oldPts);
  }

  /* ---------- анимации ---------- */
  const EASE = "cubic-bezier(.22,.61,.36,1)";
  const shown = el => !!(el && el.getClientRects().length);
  const NUM_SEL = '[data-slot$="-value"], [data-slot$="-delta"], .tile strong, .metric .lab b, .g-count, .g-pct, .arcs .val';
  const numberEls = () => Array.from(stackEl.querySelectorAll(NUM_SEL));
  const morphRaf = {};

  function flapHtml(d) {
    return `<div class="flap" data-v="${d}"><div class="h t"><span>${d}</span></div><div class="h b"><span>${d}</span></div><i class="l"></i><i class="r"></i></div>`;
  }

  async function flipFlap(flap, seq) {
    const top = flap.querySelector(".h.t span"), bot = flap.querySelector(".h.b span");
    top.textContent = bot.textContent = seq[0];
    const mk = (cls, d) => {
      const e = document.createElement("div");
      e.className = "h " + cls;
      e.innerHTML = `<span>${d}</span>`;
      flap.appendChild(e);
      return e;
    };
    for (let i = 1; i < seq.length; i++) {
      top.textContent = seq[i];
      bot.textContent = seq[i - 1];
      const a = mk("t fl-t", seq[i - 1]);
      await a.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(-90deg)" }], { duration: 90, easing: "ease-in" }).finished;
      a.remove();
      const b = mk("b fl-b", seq[i]);
      bot.textContent = seq[i];
      await b.animate([{ transform: "rotateX(90deg)" }, { transform: "rotateX(0deg)" }], { duration: 120, easing: "cubic-bezier(.3,1.4,.5,1)" }).finished;
      b.remove();
    }
  }

  function flipIn(root, delay) {
    root.querySelectorAll(".flap").forEach((flap, i) => {
      const t = Number(flap.dataset.v);
      const seq = [3, 2, 1, 0].map(k => (t - k + 10) % 10);
      flap.querySelectorAll(".h span").forEach(sp => { sp.textContent = seq[0]; });
      setTimeout(() => flipFlap(flap, seq), delay + i * 160);
    });
  }

  function drawChart(chart, delay) {
    const ln = chart.querySelector(".ln");
    const ar = chart.querySelector('path[fill^="url(#ar-"]');
    ln.setAttribute("pathLength", "1");
    ln.animate([{ strokeDasharray: "1 2", strokeDashoffset: 1 }, { strokeDasharray: "1 2", strokeDashoffset: 0 }], { duration: 900, delay, easing: EASE, fill: "backwards" });
    ar.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: delay + 400, easing: "ease-out", fill: "backwards" });
    const n = chart.querySelectorAll(".mdot").length;
    chart.querySelectorAll(".mdot:not(.is-off)").forEach(d => {
      const i = Number(d.dataset.dot);
      d.animate([{ opacity: 0, transform: "scale(0.2)" }, { opacity: 1, transform: "scale(1)" }], { duration: 260, delay: delay + 120 + i / Math.max(1, n - 1) * 700, easing: "cubic-bezier(.3,1.5,.5,1)", fill: "backwards" });
    });
    chart.querySelectorAll(".halo, .pdot, .scrub, .tooltip").forEach(e => {
      e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, delay: delay + 800, fill: "backwards" });
    });
  }

  function morphChart(id, from) {
    const chart = document.querySelector(`[data-chart="${id}"]`);
    const c = charts[id];
    const to = c.pts;
    const ln = chart.querySelector(".ln");
    const ar = chart.querySelector('path[fill^="url(#ar-"]');
    const dots = chart.querySelectorAll(".mdot");
    const hits = chart.querySelectorAll(".hit");
    chart.querySelectorAll(".ylab").forEach(e => e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: "ease-out" }));
    cancelAnimationFrame(morphRaf[id]);
    const t0 = performance.now(), DUR = 550;
    const frame = now => {
      const p = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - p, 3);
      const cur = to.map((pt, i) => Object.assign({}, pt, { y: from[i].y + (pt.y - from[i].y) * e }));
      const d = smooth(cur);
      ln.setAttribute("d", d);
      ar.setAttribute("d", `${d} L ${cur[cur.length - 1].x.toFixed(1)} 260 L ${cur[0].x.toFixed(1)} 260 Z`);
      cur.forEach((pt, i) => {
        dots[i].style.top = (pt.y - 4).toFixed(1) + "px";
        hits[i].style.top = pt.y.toFixed(1) + "px";
      });
      c.pts = cur;
      selectPoint(id, c.cur != null ? c.cur : c.sel);
      if (p < 1) morphRaf[id] = requestAnimationFrame(frame);
      else { c.pts = to; selectPoint(id, c.cur != null ? c.cur : c.sel); }
    };
    morphRaf[id] = requestAnimationFrame(frame);
  }

  function countUp(el, oldT) {
    const newT = el.textContent;
    if (oldT === newT) return;
    const re = /\d+(?:,\d+)?/;
    const a = oldT.match(re), b = newT.match(re);
    if (!a || !b) return;
    const num = x => parseFloat(x.replace(",", "."));
    const from = num(a[0]), to = num(b[0]);
    if (from === to) return;
    const dec = (b[0].split(",")[1] || "").length;
    const token = el._ct = (el._ct || 0) + 1;
    const t0 = performance.now(), DUR = 650;
    const step = now => {
      if (el._ct !== token) return;
      const p = Math.min(1, (now - t0) / DUR);
      const v = from + (to - from) * (1 - Math.pow(1 - p, 3));
      el.textContent = p < 1 ? newT.replace(re, v.toFixed(dec).replace(".", ",")) : newT;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function growMetrics(root, delay) {
    root.querySelectorAll('.arcs-svg path[stroke^="url("]').forEach((p, i) => {
      if (!shown(p)) return;
      p.setAttribute("pathLength", "1");
      p.animate([{ strokeDasharray: "1 2", strokeDashoffset: 1 }, { strokeDasharray: "1 2", strokeDashoffset: 0 }], { duration: 900, delay: delay + i * 140, easing: EASE, fill: "backwards" });
    });
    root.querySelectorAll(".track .fill").forEach((f, i) => {
      if (!shown(f)) return;
      f.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 650, delay: delay + i * 70, easing: EASE, fill: "backwards" });
    });
  }

  function playIn(root, delay) {
    if (reduce || !root) return;
    root.querySelectorAll(".chart").forEach(chart => { if (shown(chart)) drawChart(chart, delay); });

    flipIn(root, delay);
  }

  function animateUpdate(before, oldPts) {
    if (reduce) return;
    const els = numberEls();
    if (els.length === before.length) els.forEach((el, i) => { if (shown(el)) countUp(el, before[i]); });
    Object.keys(charts).forEach(id => {
      const chart = document.querySelector(`[data-chart="${id}"]`);
      if (!shown(chart) || !charts[id]) return;
      const old = oldPts[id], cur = charts[id].pts;

      else drawChart(chart, 0);
    });
    growMetrics(stackEl, 0);
  }

  function drawDial(angle) {
    for (let i = 0; i < DOTS.length; i++) {
      const on = DOTS[i][2] <= angle + 0.5;
      if (on !== dotOn[i]) { dotOn[i] = on; dotEls[i].setAttribute("fill", on ? "#2f3dff" : "rgba(13,13,13,0.13)"); }

  }
  function tweenTo(target, dur) {
    cancelAnimationFrame(dialRaf);
    if (reduce || !dur) { level.shown = target; drawDial(target); return; }
    const from = level.shown, t0 = performance.now();
    const frame = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      level.shown = from + (target - from) * e;
      drawDial(level.shown);
      if (p < 1) dialRaf = requestAnimationFrame(frame);
    };
    dialRaf = requestAnimationFrame(frame);
  }
  function goLevel(idx, instant) {
    idx = Math.max(0, Math.min(P.steps.length - 1, idx));
    const changed = idx !== level.idx;
    showLevel(idx, changed && !instant);
    tweenTo(stepAngle(idx), instant ? 0 : 220);
  }

  function angleFromPointer(ev) {
    const box = dialEl.getBoundingClientRect();
    const k = box.width / 326;
    const x = (ev.clientX - box.left) / k - DIAL.cx, y = (ev.clientY - box.top) / k - DIAL.cy;
    let a = Math.atan2(y, x) * 180 / Math.PI;
    if (a < 0) a += 360;
    if (a < 180) a = a < 90 ? 360 : 180;
    return a;
  }
  /* при перетаскивании ползунок идёт за пальцем, на ступень встаёт после отпускания */
  let dialDrag = false, pendingAngle = null, dragRaf = 0;
  const applyDrag = () => {
    dragRaf = 0;
    if (pendingAngle == null) return;
    const a = pendingAngle; pendingAngle = null;
    const idx = Math.max(0, Math.min(P.steps.length - 1, Math.round((a - DIAL.a0) / DIAL.step)));
    if (idx !== level.idx) showLevel(idx, true);
    level.shown = a;
    drawDial(a);
  };
  dialEl.addEventListener("pointerdown", ev => {
    dialDrag = true;
    dialEl.setPointerCapture(ev.pointerId);
    cancelAnimationFrame(dialRaf);
    pendingAngle = angleFromPointer(ev);
    applyDrag();
  });
  dialEl.addEventListener("pointermove", ev => {
    if (!dialDrag) return;
    pendingAngle = angleFromPointer(ev);
    if (!dragRaf) dragRaf = requestAnimationFrame(applyDrag);
  });
  const endDialDrag = () => {
    if (!dialDrag) return;
    dialDrag = false;
    cancelAnimationFrame(dragRaf); dragRaf = 0;
    if (pendingAngle != null) applyDrag();
    tweenTo(stepAngle(level.idx), 180);
  };
  dialEl.addEventListener("pointerup", endDialDrag);
  dialEl.addEventListener("pointercancel", endDialDrag);
  dialEl.addEventListener("keydown", ev => {
    const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[ev.key];

  function setFlaps(digits, animate) {

      if (from === to) return;
      if (!animate || reduce) { flap.querySelectorAll(".h span").forEach(sp => { sp.textContent = to; }); return; }
      const seq = [from];
      const dir = to >= from ? 1 : -1;
      for (let d = from; d !== to;) { d = (d + dir + 10) % 10; seq.push(d); }
      setTimeout(() => flipFlap(flap, seq), i * 140);
    });
  }

  function confirmLevel() {
    level.set = level.idx;
    const s = P.steps[level.idx];
    const root = stackEl.querySelector('[data-screen="home-empty"]');
    root.querySelector("[data-empty-digits]").classList.remove("dim");
    root.querySelector("[data-empty-caption]").textContent = D.empty.captionSet;
    root.querySelector("[data-open-level]").textContent = D.empty.linkSet;
    closeLevel();
    const digits = s.v.startsWith("5") ? ["5", "0"] : [s.v[0], s.v[2]];
    setTimeout(() => setFlaps(digits, true), 260);
  }

  function resetEmpty() {
    level.set = null;
    const root = stackEl.querySelector('[data-screen="home-empty"]');
    root.querySelector("[data-empty-digits]").classList.add("dim");
    root.querySelector("[data-empty-caption]").textContent = D.empty.caption;
    root.querySelector("[data-open-level]").textContent = D.empty.link;
    setFlaps(["0", "0"], false);
  }

  D.mode = "data";
  function setMode(mode) {
    if (mode === D.mode) return;
    D.mode = mode;
    closeLevel(true);
    if (typeof closePeriodMenu === "function" && typeof periodMenu !== "undefined") closePeriodMenu();
    const target = mode === "new" ? "home-empty" : "home";
    stackEl.querySelectorAll(".screen").forEach(sc => {
      sc.hidden = sc.dataset.screen !== target;
      clearZoom(sc);
      sc.style.zIndex = "";
    });
    history.length = 0;
    history.push(target);
    window.dispatchEvent(new Event("resize"));
    lock = false;
    if (mode === "new") resetEmpty();
    else { refreshCharts(); playIn(screen("home"), 0); }
    document.querySelectorAll(".mode button").forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("on", on);
      b.setAttribute("aria-checked", on ? "true" : "false");
    });
  }
  document.querySelector(".mode").addEventListener("click", ev => {
    const b = ev.target.closest("[data-mode]");
    if (b) setMode(b.dataset.mode);
  });
  stackEl.addEventListener("click", ev => {
    if (ev.target.closest("[data-open-level]")) openLevel();
  });

  stackEl.innerHTML = home() + homeEmpty() + wins() + matches() + opponents() + surface();
  syncShift();
  refreshChartsDefault();
  playIn(stackEl.querySelector(".screen:not([hidden])"), 150);

  const periodMenu = document.createElement("div");
  periodMenu.className = "period-menu";
  periodMenu.hidden = true;
  periodMenu.setAttribute("role", "menu");
  periodMenu.innerHTML = D.periods.map(item =>
    `<button type="button" role="menuitemradio" data-period="${item.id}" aria-checked="false">${item.menu}</button>`
  ).join("");
  let periodAnchor = null;

  function syncMenu(id) {
    periodMenu.querySelectorAll("[data-period]").forEach(button => {
      const on = button.dataset.period === id;
      button.classList.toggle("on", on);
      button.setAttribute("aria-checked", on ? "true" : "false");
    });
  }

  function syncShift() {
    const per = periodNow();
    const maxOff = MONTH_TOTAL - Number(per.id);
    D.offset = Math.min(D.offset, maxOff);
    stackEl.querySelectorAll("[data-shift]").forEach(btn => {
      const off = D.offset - Number(btn.dataset.shift);
      btn.disabled = off < 0 || off > maxOff;
    });
  }

  function shiftPeriod(dir) {
    const per = periodNow();
    const off = D.offset - dir;
    if (off < 0 || off > MONTH_TOTAL - Number(per.id)) return;
    D.offset = off;
    stackEl.querySelectorAll("[data-period-label]").forEach(node => { node.textContent = periodLabel(per); });
    Object.keys(charts).forEach(id => { delete charts[id].cur; });
    fillSlots(model(per.id));
    syncShift();
  }

  function applyPeriod(id) {
    const period = D.periods.find(item => item.id === id);
    if (!period) return;
    D.periodId = id;
    stackEl.querySelectorAll("[data-period-label]").forEach(node => {
      node.textContent = periodLabel(period);
    });
    syncShift();
    stackEl.querySelectorAll("[data-period-open]").forEach(node => {
      node.firstChild.textContent = period.chip;
    });
    fillSlots(model(id));
    syncMenu(id);
  }

  function closePeriodMenu() {
    periodMenu.hidden = true;
    if (periodAnchor) periodAnchor.setAttribute("aria-expanded", "false");
    periodAnchor = null;
  }

  function openPeriodMenu(anchor) {
    const host = anchor.closest(".screen");
    host.appendChild(periodMenu);
    periodMenu.hidden = false;
    periodAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
    syncMenu(D.periodId);
    const hostBox = host.getBoundingClientRect();
    const anchorBox = anchor.getBoundingClientRect();
    const scale = hostBox.width / host.offsetWidth;
    const menuHeight = periodMenu.offsetHeight;
    let top = (anchorBox.bottom - hostBox.top) / scale + 8;
    if (top + menuHeight > host.offsetHeight - 16) {
      top = (anchorBox.top - hostBox.top) / scale - menuHeight - 8;
    }
    periodMenu.style.top = top + "px";
    periodMenu.style.right = Math.max(16, (hostBox.right - anchorBox.right) / scale) + "px";
  }

  function screen(id) {
    return stackEl.querySelector(`[data-screen="${id}"]`);
  }

  function bindBounce(root) {
    const clipBox = document.querySelector(".screen-clip");
    root.querySelectorAll(".scroll").forEach(scroller => {
      const inner = scroller.querySelector(".scroll-inner");
      let over = 0;
      let raf = 0;
      let finger = null;
      /* размеры читаем один раз за жест, а не на каждое движение: так нет принудительной раскладки */
      let dims = null;
      const measure = () => {
        const w = clipBox.getBoundingClientRect().width;
        dims = {
          ch: scroller.clientHeight,
          sh: scroller.scrollHeight,
          max: Math.max(0, scroller.scrollHeight - scroller.clientHeight),
          scale: w > 0 ? w / 390 : 1
        };
      };
      const maxTop = () => (dims || (measure(), dims)).max;
      window.addEventListener("resize", () => { dims = null; });
      const resist = (px) => {
        const sign = Math.sign(px);
        const x = Math.abs(px);
        return sign * (1 - 1 / (x / 140 + 1)) * 140;
      };
      const screenScale = () => (dims || (measure(), dims)).scale;
      const MAX_OVER = 300;
      const paint = () => {
        over = Math.max(-MAX_OVER, Math.min(MAX_OVER, over));
        inner.style.transition = "none";
        inner.style.transform = over ? `translate3d(0, ${resist(over)}px, 0)` : "";
      };
      const springBack = () => {
        if (!over) return;
        over = 0;
        inner.style.transition = reduce ? "none" : "transform 340ms cubic-bezier(0.2, 0.9, 0.3, 1)";
        inner.style.transform = "translate3d(0, 0, 0)";
      };
      const stopGlide = () => {
        cancelAnimationFrame(raf);
        raf = 0;
      };
      const applyDelta = (dy) => {
        if (over) {
          const nextOver = over + dy;
          if ((over > 0 && nextOver <= 0) || (over < 0 && nextOver >= 0)) {
            over = 0;
            paint();
            scroller.scrollTop = Math.max(0, Math.min(maxTop(), scroller.scrollTop - nextOver));
            return;
          }
          over = nextOver;
          paint();
          return;
        }
        const max = maxTop();
        const next = scroller.scrollTop - dy;
        if (next < 0) {
          scroller.scrollTop = 0;
          over = -next;
          paint();
        } else if (next > max) {
          scroller.scrollTop = max;
          over = max - next;
          paint();
        } else {
          scroller.scrollTop = next;
        }
      };
      const glide = (velocity) => {
        if (reduce) {
          springBack();
          return;
        }
        stopGlide();
        let vel = velocity;
        let last = performance.now();
        const frame = (now) => {
          const dt = Math.min(34, now - last);
          last = now;
          vel *= Math.exp(-dt / 220);
          applyDelta(vel * dt);
          if (Math.abs(vel) < 0.02) {
            if (over) springBack();
            raf = 0;
            return;
          }
          raf = requestAnimationFrame(frame);
        };
        raf = requestAnimationFrame(frame);
      };

      scroller.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || dragging || lock) return;
        const rect = clipBox.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (390 / rect.width);
        if (history.length > 1 && x <= 28) return;
        event.preventDefault();
        stopGlide();
        measure();
        if (over) springBack();
        finger = {
          id: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          lastY: event.clientY,
          t: performance.now(),
          v: 0,
          moved: false
        };
      }, { passive: false });
      scroller.addEventListener("pointermove", (event) => {
        if (!finger || event.pointerId !== finger.id || dragging) return;
        const dx = event.clientX - finger.x;
        const dyTotal = event.clientY - finger.y;
        if (!finger.moved) {
          if (Math.abs(dx) < 6 && Math.abs(dyTotal) < 6) return;
          finger.moved = true;
          scroller.classList.add("is-dragging");
          if (scroller.hasPointerCapture && !scroller.hasPointerCapture(event.pointerId)) {
            scroller.setPointerCapture(event.pointerId);
          }
        }
        event.preventDefault();
        const now = performance.now();
        const dt = Math.max(1, now - finger.t);
        const dy = (event.clientY - finger.lastY) / screenScale();
        finger.v = dy / dt;
        finger.lastY = event.clientY;
        finger.t = now;
        applyDelta(dy);
      });
      const endFinger = (event) => {
        if (!finger || event.pointerId !== finger.id) return;
        const moved = finger.moved;
        const vel = finger.v;
        finger = null;
        scroller.classList.remove("is-dragging");
        if (!moved) return;
        const block = (clickEvent) => {
          clickEvent.preventDefault();
          clickEvent.stopPropagation();
          scroller.removeEventListener("click", block, true);
        };
        scroller.addEventListener("click", block, true);
        if (over) {
          if (Math.abs(vel) > 0.3) glide(vel);
          else springBack();
          return;
        }
        glide(vel);
      };
      scroller.addEventListener("pointerup", endFinger);
      scroller.addEventListener("pointercancel", endFinger);

      const thumb = document.createElement("i");
      thumb.className = "ios-bar";
      scroller.appendChild(thumb);
      let hideThumb = 0;
      const topbar = scroller.parentElement.querySelector(":scope > .topbar");
      const navSlot = topbar && topbar.querySelector(".nav-slot");
      const largeTitle = scroller.querySelector(".large-title");
      const onHome = Boolean(scroller.closest(".is-home"));
      let syncRaf = 0, lastScrolled = null, lastNav = "", lastTitle = "", lastThumb = "", thumbOn = false;
      const syncNow = () => {
        syncRaf = 0;
        const y = scroller.scrollTop;
        if (!dims) measure();
        const max = dims.max;
        if (topbar) {
          const scrolled = y > 1;
          if (scrolled !== lastScrolled) { lastScrolled = scrolled; topbar.classList.toggle("is-scrolled", scrolled); }
          if (navSlot) {
            const v = reduce ? (y > 24 ? "1" : "0") : String(Math.max(0, Math.min(1, (y - 12) / 20)));
            if (v !== lastNav) { lastNav = v; navSlot.style.opacity = v; }
          }
          if (largeTitle) {
            const v = reduce ? "1" : String(1 - Math.min(1, y / 16));
            if (v !== lastTitle) { lastTitle = v; largeTitle.style.opacity = v; }
          }
        }
        if (max <= 1) return;
        const bottomGap = onHome ? 130 : 24;
        const track = Math.max(48, dims.ch - 70 - bottomGap);
        const size = Math.max(32, track * (dims.ch / dims.sh));
        const travel = Math.max(1, track - size);
        const tf = `translate3d(0, ${((y / max) * travel).toFixed(1)}px, 0)`;
        if (thumb._h !== size) { thumb._h = size; thumb.style.height = size + "px"; }
        if (tf !== lastThumb) { lastThumb = tf; thumb.style.transform = tf; }
        if (!thumbOn) { thumbOn = true; thumb.classList.add("on"); }
        clearTimeout(hideThumb);
        hideThumb = setTimeout(() => { thumbOn = false; thumb.classList.remove("on"); }, 450);
      };
      const syncScroll = () => { if (!syncRaf) syncRaf = requestAnimationFrame(syncNow); };
      scroller.addEventListener("scroll", syncScroll, { passive: true });

      scroller.addEventListener("wheel", (event) => {
        if (reduce || dragging || finger) return;
        stopGlide();
        { const t = performance.now(); if (!dims || t - (scroller._wt || 0) > 200) measure(); scroller._wt = t; }
        if (scroller._cool && performance.now() < scroller._cool) { event.preventDefault(); return; }
        const atTop = scroller.scrollTop <= 0;
        const atBottom = scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1;
        const pulling = (atTop && event.deltaY < 0) || (atBottom && event.deltaY > 0) || over;
        if (!pulling) {
          if (over) springBack();
          return;
        }
        event.preventDefault();
        applyDelta(-event.deltaY / screenScale());
        clearTimeout(scroller._spring);
        scroller._spring = setTimeout(() => { springBack(); scroller._cool = performance.now() + 450; }, 80);
      }, { passive: false });
    });
  }
  bindBounce(stackEl);

  function localRect(el, host) {
    const hostBox = host.getBoundingClientRect();
    const box = el.getBoundingClientRect();
    const scale = hostBox.width / host.offsetWidth;
    return {
      top: (box.top - hostBox.top) / scale,
      left: (box.left - hostBox.left) / scale,
      width: box.width / scale,
      height: box.height / scale
    };
  }

  function clipAt(rect, p) {
    const top = rect.top * p;
    const left = rect.left * p;
    const right = Math.max(0, 390 - rect.left - rect.width) * p;
    const bottom = Math.max(0, 844 - rect.top - rect.height) * p;
    const radius = 42 - 14 * p;
    return `inset(${top}px ${right}px ${bottom}px ${left}px round ${radius}px)`;
  }

  function clearZoom(el) {
    el.style.transition = "";
    el.style.transform = "";
    el.style.clipPath = "";
  }

  function push(id, sourceEl) {
    if (lock || history[history.length - 1] === id) return;
    const from = screen(history[history.length - 1]);
    const to = screen(id);
    to.hidden = false;
    window.dispatchEvent(new Event("resize"));
    refreshCharts();
    playIn(to, 220);
    to.style.zIndex = "2";
    from.style.zIndex = "1";
    if (sourceEl) zoomFrom[id] = sourceEl;
    if (reduce) {
      from.hidden = true;
      history.push(id);
      return;
    }
    const rect = sourceEl ? localRect(sourceEl, from) : null;
    lock = true;
    to.style.transition = "none";
    from.style.transition = "none";
    if (!rect) {
      to.style.transform = "translate3d(100%,0,0)";
      requestAnimationFrame(() => {
        to.style.transition = PUSH;
        from.style.transition = PUSH;
        to.style.transform = "translate3d(0,0,0)";
        from.style.transform = "translate3d(-30%,0,0)";
      });
    } else {
      to.style.clipPath = clipAt(rect, 1);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        to.style.transition = ZOOM;
        from.style.transition = ZOOM_BACK;
        to.style.clipPath = clipAt(rect, 0);
        from.style.transform = "scale(0.94)";
      }));
    }
    const done = (event) => {
      if (done.ran) return;
      if (event && event.target !== to) return;
      if (event && event.propertyName && event.propertyName !== (rect ? "clip-path" : "transform")) return;
      done.ran = true;
      to.removeEventListener("transitionend", done);
      clearZoom(to);
      from.hidden = true;
      clearZoom(from);
      lock = false;
    };
    to.addEventListener("transitionend", done);
    setTimeout(done, 540);
    history.push(id);
  }

  function pop(fromDrag) {
    if (history.length < 2 || lock) return;
    const id = history.pop();
    const from = screen(id);
    const to = screen(history[history.length - 1]);
    to.hidden = false;
    to.style.zIndex = "1";
    from.style.zIndex = "2";
    if (reduce) {
      from.hidden = true;
      from.style.transform = "";
      return;
    }
    const source = zoomFrom[id];
    const rect = source && source.isConnected ? localRect(source, to) : null;
    lock = true;
    if (!fromDrag) {
      if (rect) {
        from.style.transition = "none";
        to.style.transition = "none";
        from.style.clipPath = clipAt(rect, 0);
        to.style.transform = "scale(0.94)";
        requestAnimationFrame(() => {
          from.style.transition = ZOOM;
          to.style.transition = ZOOM_BACK;
          from.style.clipPath = clipAt(rect, 1);
          to.style.transform = "scale(1)";
        });
      } else {
        from.style.transition = PUSH;
        to.style.transition = PUSH;
        from.style.transform = "translate3d(100%,0,0)";
        to.style.transform = "translate3d(0,0,0)";
      }
    }
    const done = (event) => {
      if (done.ran) return;
      if (event && event.target !== from) return;
      if (event && event.propertyName && event.propertyName !== (rect ? "clip-path" : "transform")) return;
      done.ran = true;
      from.removeEventListener("transitionend", done);
      from.hidden = true;
      clearZoom(from);
      clearZoom(to);
      lock = false;
    };
    from.addEventListener("transitionend", done);
    setTimeout(done, 540);
  }

  stackEl.addEventListener("click", (event) => {
    const shift = event.target.closest("[data-shift]");
    if (shift) {
      shiftPeriod(Number(shift.dataset.shift));
      return;
    }
    const choice = event.target.closest("[data-period]");
    if (choice) {
      applyPeriod(choice.dataset.period);
      closePeriodMenu();
      return;
    }
    const opener = event.target.closest("[data-period-open]");
    if (opener) {
      if (periodAnchor === opener) closePeriodMenu();
      else openPeriodMenu(opener);
      return;
    }
    if (!periodMenu.hidden) {
      closePeriodMenu();
      return;
    }
    const cp = event.target.closest("[data-cp]");
    if (cp) {
      const [chartId, index] = cp.dataset.cp.split(":");
      selectPoint(chartId, Number(index));
      return;
    }
    const pushBtn = event.target.closest("[data-push]");
    if (pushBtn) {
      push(pushBtn.dataset.push, pushBtn);
      return;
    }
    if (event.target.closest("[data-pop]")) pop(false);
    const surfaceBtn = event.target.closest("[data-surface]");
    if (surfaceBtn) {
      stackEl.querySelectorAll("[data-surface]").forEach(btn => btn.classList.toggle("on", btn === surfaceBtn));
      fillSlots(model(D.periodId), "surf-list");
    }
  });

  const clip = document.querySelector(".screen-clip");
  let drag = null;
  clip.addEventListener("pointerdown", (event) => {
    if (lock || history.length < 2 || event.button !== 0) return;
    const rect = clip.getBoundingClientRect();
    const x = (event.clientX - rect.left) * (390 / rect.width);
    if (x > 28) return;
    const from = screen(history[history.length - 1]);
    const to = screen(history[history.length - 2]);
    const source = zoomFrom[history[history.length - 1]];
    const zoomRect = source && source.isConnected ? localRect(source, to) : null;
    to.hidden = false;
    drag = { x: event.clientX, last: event.clientX, t: performance.now(), v: 0, p: 0, from, to, zoomRect };
    dragging = true;
    from.style.transition = "none";
    to.style.transition = "none";
    if (zoomRect) {
      from.style.clipPath = clipAt(zoomRect, 0);
      to.style.transform = "scale(0.94)";
    } else {
      to.style.transform = "translate3d(-30%,0,0)";
    }
    clip.setPointerCapture(event.pointerId);
  });
  clip.addEventListener("pointermove", (event) => {
    if (!drag) return;
    const now = performance.now();
    const dx = Math.max(0, event.clientX - drag.x);
    const dt = Math.max(16, now - drag.t);
    drag.v = (event.clientX - drag.last) / dt;
    drag.last = event.clientX;
    drag.t = now;
    if (drag.zoomRect) {
      const p = Math.min(1, dx / 240);
      drag.p = p;
      drag.from.style.clipPath = clipAt(drag.zoomRect, p);
      drag.to.style.transform = `scale(${0.94 + 0.06 * p})`;
      return;
    }
    const p = Math.min(1, dx / 390);
    drag.from.style.transform = `translate3d(${dx}px,0,0)`;
    drag.to.style.transform = `translate3d(${-30 * (1 - p)}%,0,0)`;
  });
  function endDrag(event) {
    if (!drag) return;
    const dx = Math.max(0, event.clientX - drag.x);
    const zooming = Boolean(drag.zoomRect);
    const shouldPop = zooming ? (drag.p > 0.35 || drag.v > 0.45) : (dx > 120 || drag.v > 0.45);
    dragging = false;
    const from = drag.from;
    const to = drag.to;
    const zoomRect = drag.zoomRect;
    drag = null;
    if (shouldPop) {
      lock = true;
      if (zooming) {
        from.style.transition = ZOOM;
        to.style.transition = ZOOM_BACK;
        from.style.clipPath = clipAt(zoomRect, 1);
        to.style.transform = "scale(1)";
      } else {
        from.style.transition = PUSH;
        to.style.transition = PUSH;
        from.style.transform = "translate3d(100%,0,0)";
        to.style.transform = "translate3d(0,0,0)";
      }
      history.pop();
      const done = (event) => {
        if (done.ran) return;
        if (event && event.target !== from) return;
        done.ran = true;
        from.removeEventListener("transitionend", done);
        from.hidden = true;
        clearZoom(from);
        clearZoom(to);
        lock = false;
      };
      from.addEventListener("transitionend", done);
      setTimeout(done, 540);
    } else if (zooming) {
      from.style.transition = ZOOM;
      to.style.transition = ZOOM_BACK;
      from.style.clipPath = clipAt(zoomRect, 0);
      to.style.transform = "scale(0.94)";
      const done = (event) => {
        if (done.ran) return;
        if (event && event.target !== from) return;
        done.ran = true;
        from.removeEventListener("transitionend", done);
        clearZoom(from);
        to.hidden = true;
        clearZoom(to);
      };
      from.addEventListener("transitionend", done);
      setTimeout(done, 540);
    } else {
      from.style.transition = PUSH;
      to.style.transition = PUSH;
      from.style.transform = "translate3d(0,0,0)";
      to.style.transform = "translate3d(-30%,0,0)";
      const done = () => {
        from.removeEventListener("transitionend", done);
        to.hidden = true;
        to.style.transform = "";
      };
      from.addEventListener("transitionend", done);
    }
  }
  clip.addEventListener("pointerup", endDrag);
  clip.addEventListener("pointercancel", endDrag);

  screen("home").hidden = false;
})();
</script>
</body>
</html>
